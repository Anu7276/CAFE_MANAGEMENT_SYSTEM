version: '3.8'

services:
  server:
    build: ./server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://localhost:27017/cafe_emerald
      - JWT_SECRET=production_secret_emerald_8899
      - CLIENT_URL=http://localhost:5173

  client:
    build: ./client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

