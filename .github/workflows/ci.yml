name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Run Client Vite Production Build
        run: npm run build --prefix client

      - name: Run Complete Automated Test Suite (Phases 1-5)
        run: npm test --prefix server
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_emerald_2026
          TABLE_TOKEN_SECRET: ci_table_secret_token_2026

  docker-build:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: cafe-emerald-server:latest

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: cafe-emerald-client:latest
